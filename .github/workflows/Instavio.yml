name: Instavio - Download & Upload Instagram Videos

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to download videos from'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    name: Instavio - @${{ github.event.inputs.username }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Instavio/requirements.txt
      
      - name: 🎬 Get username
        id: username
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          if [ -z "$USERNAME" ]; then
            echo "❌ Error: Username not provided"
            exit 1
          fi
          echo "instagram_user=$USERNAME" >> $GITHUB_OUTPUT
          echo "✓ Target username: $USERNAME"
      
      - name: 🔐 Verify API Key Configuration
        id: verify_key
        run: |
          if [ -z "${{ secrets.ELITE_CLOUD_API_KEY }}" ]; then
            echo "⚠️  WARNING: ELITE_CLOUD_API_KEY secret not set"
            echo "   Videos will be downloaded locally only"
            echo "   To enable cloud upload:"
            echo "   1. Go to Settings → Secrets and variables → Actions"
            echo "   2. Create new secret: ELITE_CLOUD_API_KEY"
            echo "   3. Paste your Elite Cloud API key"
            echo "has_api_key=false" >> $GITHUB_OUTPUT
          else
            echo "✓ Elite Cloud API Key is configured (using GitHub Secrets)"
            echo "   🔐 API key is COMPLETELY HIDDEN in logs"
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 🎥 Download & Upload Videos
        id: process
        env:
          # ⚠️  API key is NEVER logged or displayed
          # It's only accessible to the script through environment
          # GitHub automatically masks secrets in logs
          ELITE_CLOUD_API_KEY: ${{ secrets.ELITE_CLOUD_API_KEY }}
        run: |
          echo "✓ Running Instavio..."
          python Instavio/main.py "${{ steps.username.outputs.instagram_user }}"
      
      - name: 📊 Check downloaded files
        if: always()
        run: |
          USERNAME="${{ steps.username.outputs.instagram_user }}"
          if [ -d "downloads/$USERNAME" ]; then
            echo "✅ Download directory found"
            echo "📂 Contents:"
            ls -lh "downloads/$USERNAME/" || echo "Directory is empty"
            echo ""
            echo "📈 Total files:"
            find "downloads/$USERNAME/" -type f | wc -l
          else
            echo "⚠️ No videos were downloaded"
          fi
      
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: instavio-videos-${{ steps.username.outputs.instagram_user }}
          path: downloads/${{ steps.username.outputs.instagram_user }}/
          if-no-files-found: warn
          retention-days: 30
      
      - name: 📝 Generate Job Summary
        if: always()
        run: |
          echo "## 🎬 Instavio Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Username** | @${{ steps.username.outputs.instagram_user }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Execution Date** | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cloud Upload** | ${{ steps.verify_key.outputs.has_api_key == 'true' && '✅ Enabled' || '❌ Disabled' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Key Visibility** | 🔐 COMPLETELY HIDDEN |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Details" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API key stored in **GitHub Secrets** (encrypted)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API key **NEVER** logged or displayed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API key **NEVER** committed to repository" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ .gitignore protects local .env files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Download Location" >> $GITHUB_STEP_SUMMARY
          echo "\`downloads/${{ steps.username.outputs.instagram_user }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          USERNAME="${{ steps.username.outputs.instagram_user }}"
          if [ -d "downloads/$USERNAME" ]; then
            VIDEO_COUNT=$(find "downloads/$USERNAME/" -type f | wc -l)
            echo "### 📊 Download Statistics" >> $GITHUB_STEP_SUMMARY
            echo "- **Videos Downloaded:** $VIDEO_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Storage:** Artifacts (30-day retention)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.verify_key.outputs.has_api_key }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ☁️ Elite Cloud Upload" >> $GITHUB_STEP_SUMMARY
            echo "📂 **Folder Path:** \`Elite Clip/${{ steps.username.outputs.instagram_user }}/\`" >> $GITHUB_STEP_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Videos automatically uploaded via GitHub Secrets (API key protected)" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Setup Cloud Upload" >> $GITHUB_STEP_SUMMARY
            echo "To enable automatic cloud uploads:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **Navigate to:** Settings → Secrets and variables → Actions" >> $GITHUB_STEP_SUMMARY
            echo "2. **Click:** New repository secret" >> $GITHUB_STEP_SUMMARY
            echo "3. **Enter:**" >> $GITHUB_STEP_SUMMARY
            echo "   - Name: \`ELITE_CLOUD_API_KEY\`" >> $GITHUB_STEP_SUMMARY
            echo "   - Value: Your Elite Cloud API key" >> $GITHUB_STEP_SUMMARY
            echo "4. **Click:** Add secret" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Security Assurances" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 API keys stored in **GitHub Secrets** (AES-128-GCM encryption)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 .env files protected by **.gitignore**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 No secrets in code files" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Secrets never logged or output" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Automatic masking in GitHub Actions logs" >> $GITHUB_STEP_SUMMARY
