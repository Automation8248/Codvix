name: Instavio - Download & Upload Instagram Videos

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Instagram username to download videos from"
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Instavio/requirements.txt

      - name: Get username
        id: username
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          if [ -z "$USERNAME" ]; then
            echo "Username is required"
            exit 1
          fi
          echo "instagram_user=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Run downloader
        env:
          ELITE_CLOUD_API_KEY: ${{ secrets.ELITE_CLOUD_API_KEY }}
        run: |
          python Instavio/main.py "${{ steps.username.outputs.instagram_user }}"

      - name: Upload downloaded files as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instavio-videos-${{ steps.username.outputs.instagram_user }}
          path: downloads/${{ steps.username.outputs.instagram_user }}/
          if-no-files-found: warn
          retention-days: 30
