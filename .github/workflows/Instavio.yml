name: Instavio - Download Instagram Videos

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to download videos from'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/Instavio.yml'

jobs:
  download-instagram-videos:
    runs-on: ubuntu-latest
    name: Download Videos from @${{ github.event.inputs.username || 'input-username' }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Instavio/requirements.txt
      
      - name: 🎬 Get username
        id: username
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          if [ -z "$USERNAME" ]; then
            echo "❌ Error: Username not provided"
            exit 1
          fi
          echo "instagram_user=$USERNAME" >> $GITHUB_OUTPUT
          echo "✓ Target username: $USERNAME"
      
      - name: 📥 Download videos
        id: download
        run: |
          python Instavio/main.py "${{ steps.username.outputs.instagram_user }}"
      
      - name: 📊 Check downloaded files
        run: |
          USERNAME="${{ steps.username.outputs.instagram_user }}"
          if [ -d "downloads/$USERNAME" ]; then
            echo "✅ Download directory found"
            echo "📂 Contents:"
            ls -lah "downloads/$USERNAME/" || echo "Directory is empty"
            echo ""
            echo "Total files:"
            find "downloads/$USERNAME/" -type f | wc -l
          else
            echo "⚠️ No videos were downloaded"
          fi
      
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: instagram-videos-${{ steps.username.outputs.instagram_user }}
          path: downloads/${{ steps.username.outputs.instagram_user }}/
          if-no-files-found: warn
          retention-days: 30
      
      - name: 📝 Job Summary
        if: always()
        run: |
          echo "## 🎥 Instavio Download Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Username:** @${{ steps.username.outputs.instagram_user }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Download Statistics" >> $GITHUB_STEP_SUMMARY
          USERNAME="${{ steps.username.outputs.instagram_user }}"
          if [ -d "downloads/$USERNAME" ]; then
            VIDEO_COUNT=$(find "downloads/$USERNAME/" -type f | wc -l)
            echo "- **Videos Downloaded:** $VIDEO_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Location:** \`downloads/$USERNAME/\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "All downloaded videos are available in the artifacts section above." >> $GITHUB_STEP_SUMMARY
