name: Download, Extract and Rename Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Run Python Script
        run: python unzip_folder/script.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Pixhub/Sales post/emergency fund/*"
          git commit -m "Auto-downloaded, extracted, and renamed images from Google Drive" || echo "No changes to commit"
          git push
