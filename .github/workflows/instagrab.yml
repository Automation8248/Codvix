name: IG to N8N Orchestrator

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd InstaGrab
          pip install requests

      - name: Run Orchestrator Script
        env:
          ELITE_CLOUD_API_KEY: ${{ secrets.ELITE_CLOUD_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          cd InstaGrab
          python main.py

      - name: Save tracking files back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          touch InstaGrab/track.json
          touch InstaGrab/counters.json
          
          git add InstaGrab/track.json
          git add InstaGrab/counters.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Update track and counters for new reels [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No new URLs tracked. Skipping commit."
          fi
