name: Clone Gateway Repository

on:
  workflow_dispatch:
    inputs:
      target_git_url:
        description: 'Paste Target Git URL here (Jisko copy karna hai)'
        required: true
        type: string
      new_repo_name:
        description: 'New Repository Name (Short name, e.g., gateway-pay)'
        required: true
        default: 'gateway-pay'
        type: string

jobs:
  copy-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Clone Script
        env:
          TARGET_GIT_URL: ${{ github.event.inputs.target_git_url }}
          NEW_REPO_NAME: ${{ github.event.inputs.new_repo_name }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: python "Copy Git/main.py"
