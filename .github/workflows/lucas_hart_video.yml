name: Lucas Hart Video Automation

on:
  workflow_dispatch:
  # schedule:
  #  - cron: "0 2 * * *"  # Agar auto-run karna ho toh is line se # hata dein

permissions:
  contents: write

jobs:
  generate_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup System Tools (Fast & Bulletproof)
        run: |
          # 1. Fast Update ignoring network drops
          sudo apt-get update -qq -y --allow-releaseinfo-change || true
          
          # 2. Install ONLY FFmpeg with Retry Logic (MoviePy needs this to export video)
          # Note: ImageMagick and Fonts are REMOVED to make it 4x faster and 100% error-free!
          for i in 1 2 3; do
             sudo apt-get install -y --no-install-recommends ffmpeg && break || sleep 5;
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # <-- PIP CACHE: Agli baar python packages instantly load honge

      - name: Install Python Dependencies
        run: |
          cd "Video Generator/Lucas Hart"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          TELEGRAM_FAILD_ID: ${{ secrets.TELEGRAM_FAILD_ID }}
        run: |
          cd "Video Generator/Lucas Hart"
          python main.py
