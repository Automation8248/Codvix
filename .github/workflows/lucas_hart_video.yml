name: Lucas Hart Video Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup System Tools (Fast & Bulletproof)
        run: |
          # 1. Fast Update ignoring network drops
          sudo apt-get update -qq -y --allow-releaseinfo-change || true
          
          # 2. Fast Install for FFmpeg, ImageMagick & Liberation Fonts (with retry logic)
          for i in 1 2 3; do
             sudo apt-get install -y --no-install-recommends ffmpeg imagemagick fonts-liberation && break || sleep 5;
          done

          # 3. Arial Font Install (Auto-accept EULA)
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer || true
          sudo fc-cache -f -v

          # 4. Specific ImageMagick Policy Fix (from your provided logic)
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-*/policy.xml || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-moviepy-requests-pillow-pygithub
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Deps
        run: |
          cd "Video Generator/Lucas Hart"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          TELEGRAM_FAILD_ID: ${{ secrets.TELEGRAM_FAILD_ID }}
        run: |
          cd "Video Generator/Lucas Hart"
          python main.py
