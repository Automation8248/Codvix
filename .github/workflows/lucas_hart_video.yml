name: Lucas Hart Video Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd "Video Generator/Lucas Hart"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_FAILD_TOKEN: ${{ secrets.TELEGRAM_FAILD_TOKEN }}
          TELEGRAM_FAILD_ID: ${{ secrets.TELEGRAM_FAILD_ID }}
        run: |
          cd "Video Generator/Lucas Hart"
          python main.py
