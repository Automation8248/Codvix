name: IG to ShreeCloud Auto-Uploader

on:
  schedule:
    - cron: '*/05 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          cd InstaGrab
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Determine Trigger Type for Recording
        id: check_trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IS_MANUAL_RUN=true" >> $GITHUB_ENV
          else
            echo "IS_MANUAL_RUN=false" >> $GITHUB_ENV
          fi

      - name: Run Automation Script
        env:
          ELITE_CLOUD_API_KEY: ${{ secrets.ELITE_CLOUD_API_KEY }}
        run: |
          cd InstaGrab
          python main.py

      - name: Upload Screen Recordings (If Manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: screen-recordings
          path: InstaGrab/recordings/
          retention-days: 3

      - name: Save tracking files back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialize tracker files agar wo nahi bane hain toh (Git Error se bachne ke liye)
          touch InstaGrab/track.json
          touch InstaGrab/counters.json
          
          # Dono files ko git me add karna
          git add InstaGrab/track.json
          git add InstaGrab/counters.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Update track and counters for new reels [skip ci]"
            git push
          else
            echo "No new URLs tracked. Skipping commit."
          fi
