name: Multi-Repo Image Sync Automation

on:
  schedule:
    - cron: '0 4 * * *' 
  workflow_dispatch: 

jobs:
  cross-repo-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout Target Repository (Postza)
        uses: actions/checkout@v3
        with:
          repository: 'Automation8248/Postza'
          path: 'PicSync/Postza' 
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Downloader Script
        run: |
          cd PicSync
          python main.py

      - name: Commit & Push to Postza (Target)
        run: |
          cd PicSync/Postza
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add RadhaSocialSync/photos/
          git commit -m "Auto-synced new images to RadhaSocialSync" || echo "No images to push in Target"
          git push

      - name: Commit & Push History to Source
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Dono files add hongi (JSON logic ke liye, TXT links ke liye)
          git add PicSync/history.json
          git add PicSync/history.txt
          git commit -m "Auto-updated history files (JSON & TXT)" || echo "No history updates"
          git push
