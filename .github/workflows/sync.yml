name: Multi-Repo Image Sync Automation

on:
  schedule:
    - cron: '0 4 * * *' # Daily subah 4 baje (UTC) run hoga
  workflow_dispatch: # Manual trigger button

jobs:
  cross-repo-sync:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Current Repository (Source) Checkout karna
      - name: Checkout Source Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      # Step 2: Target Repository (Postza) Checkout karna (PicSync folder ke andar)
      - name: Checkout Target Repository (Postza)
        uses: actions/checkout@v3
        with:
          repository: 'Automation8248/Postza'
          path: 'PicSync/Postza' # Postza ko PicSync ke andar clone karega
          token: ${{ secrets.GH_TOKEN }}

      # Step 3: Python setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      # Step 4: Run the Script (PicSync folder ke andar jaakar)
      - name: Run Downloader Script
        run: |
          cd PicSync
          python main.py

      # Step 5: Upload images to Target Repository (Postza)
      - name: Commit & Push to Postza (Target)
        run: |
          cd PicSync/Postza
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add RadhaSocialSync/photos/
          git commit -m "Auto-synced new images to RadhaSocialSync" || echo "No images to push in Target"
          git push

      # Step 6: Update history.json in Source Repository
      - name: Commit & Push History to Source
        run: |
          # Wapas main folder me aakar Source repo me history update karega
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add PicSync/history.json
          git commit -m "Auto-updated history.json state" || echo "No history updates"
          git push
