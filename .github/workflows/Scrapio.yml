name: Scrapio Automation

on:
  schedule:
    # Har 8 minutes mein UTC time ke hisab se run hoga
    - cron: '*/8 * * * *'
  workflow_dispatch:

# Concurrency control: Overlapping runs ko rokiyega
concurrency:
  group: scrapio-automation
  cancel-in-progress: false # Pichhla task complete hone dega, naye ko queue me rakhega

jobs:
  run_scrapio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0             # Git history fetch karne ke liye (Rebase ke liye zaroori)
          persist-credentials: true  # Push access ke liye credentials persist karega

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          set -e # Fail-fast behavior: agar koi command fail ho to aage run na ho
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: Run Scrapio Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          python PicSync/Scrapio.py

      - name: Commit track.json updates safely
        run: |
          set -e # Fail-fast behavior
          
          # 1. GitHub Actions Bot ki identity set karna
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 2. File ki existence check karna aur safely staging area me add karna
          if [ -f "PicSync/track.json" ]; then
            git add PicSync/track.json
            
            # 3. Check karna ki file me actually koi naya change hai ya nahi
            if ! git diff --staged --quiet; then
              echo "Changes detected in track.json. Committing..."
              
              # Pehle commit karein (uncommitted changes ke sath rebase fail ho jata hai)
              git commit -m "chore: Update track.json with batch progress via Scrapio"
              
              # 4. Remote state fetch karna aur rebase karna (stale-branch conflicts avoid karne ke liye)
              git fetch origin main
              git rebase origin/main
              
              # 5. Risky pull/push sequence ki jagah direct HEAD:main push karna
              git push origin HEAD:main
              
              echo "Changes successfully pushed to main branch."
            else
              echo "track.json me koi change nahi hua. Push skip kiya gaya."
            fi
          else
            echo "PicSync/track.json file nahi mili. Commit skip kiya gaya."
          fi
