name: Scrapio Automation

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

concurrency:
  group: scrapio-automation
  cancel-in-progress: false 

jobs:
  run_scrapio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Kolkata # India ka timezone set kiya hai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: Run Scrapio Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          python PicSync/Scrapio.py

      - name: Commit track.json updates safely
        run: |
          set -e 
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [ -f "PicSync/track.json" ]; then
            git add PicSync/track.json
            
            if ! git diff --staged --quiet; then
              echo "Changes detected! Committing exactly at IST 8-min interval..."
              
              git commit -m "chore: Update track.json with batch progress via Scrapio"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
              
              echo "Push successful!"
            else
              echo "No new changes in track.json. Skip push."
            fi
          else
            echo "track.json not found. Skip commit."
          fi
