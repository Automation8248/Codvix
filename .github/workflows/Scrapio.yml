name: Scrapio Automation

on:
  schedule:
    # Har din raat 12 baje (UTC) run hoga.
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  run_scrapio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: Run Scrapio Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python PicSync/Scrapio.py

      - name: Commit track.json updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add PicSync/track.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Update track.json with new processed folder via Scrapio"
          git push
