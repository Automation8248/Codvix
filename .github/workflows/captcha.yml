name: Image Text Extractor Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual run ke liye button

jobs:
  extract_text:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python Libraries
        run: |
          pip install pytesseract Pillow opencv-python-headless

      - name: Run Captcha Extractor
        run: |
          cd "Captcha Solve"
          python main.py
