name: Image Text Extractor Automation

on:
  push:
    branches:
      - main
  workflow_dispatch: # Isse aap manually bhi GitHub par button click karke run kar sakte hain
  # schedule:
  #   - cron: '0 0 * * *' # Agar daily automatically run karna ho toh isko uncomment karein

jobs:
  extract_text:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python Libraries
        run: |
          pip install pytesseract Pillow

      - name: Run Random Image Text Extractor
        run: |
          python main.py
