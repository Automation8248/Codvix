name: Cloudflare Web Scraper

on:
  workflow_dispatch: # Manual trigger (will record screen)
  schedule:
    - cron: '0 6 * * *' # Automatic trigger (runs daily at 6:00 AM UTC, no recording)

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Run Scraper WITH Screen Recording (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 1. Start Virtual Display (Xvfb)
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          
          # 2. Xvfb ko load hone ka time dein varna FFmpeg crash ho jayega
          sleep 2 
          
          echo "Manual trigger detected. Starting screen recording..."
          
          # 3. Directory ke andar jaakar FFmpeg start karein taaki path issue na aaye
          cd "Web Scrape"
          
          # FFmpeg output logs chalu rakhe hain (> /dev/null hataya)
          ffmpeg -video_size 1920x1080 -framerate 30 -f x11grab -i :99.0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p recording.mp4 &
          FFMPEG_PID=$!
          
          # 4. Python script run karein
          python scraper.py || echo "Python script failed, but saving video..."
          
          # 5. Stop FFmpeg gracefully to save the video file (mp4 container pack hone ke liye zaroori)
          kill -INT $FFMPEG_PID
          sleep 3

      - name: Run Scraper WITHOUT Screen Recording (Automatic Run)
        if: github.event_name != 'workflow_dispatch'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          echo "Automatic trigger detected. Skipping screen recording..."
          cd "Web Scrape"
          python scraper.py

      - name: Upload Artifacts (v4)
        # always() lagana zaroori hai taaki script fail hone par bhi recording upload ho
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: Scraping-Artifacts
          path: |
            Web Scrape/screenshot.png
            Web Scrape/recording.mp4
          if-no-files-found: ignore
