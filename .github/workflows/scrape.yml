name: Cloudflare Web Scraper

on:
  workflow_dispatch: # Manual trigger (Screen recording hogi)
  schedule:
    - cron: '0 6 * * *' # Automatic trigger (Daily 6 AM UTC par chalega, recording nahi hogi)

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          sudo apt-get update
          # Xvfb (Virtual display) aur FFmpeg (Recording) install kar rahe hain
          sudo apt-get install -y xvfb ffmpeg

      - name: Run Scraper WITH Screen Recording (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Virtual Display start karega aur warnings ko hide kar dega
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          
          # 👉 FIX 1: Xvfb ko initialize hone ke liye 2 seconds dena zaroori hai
          sleep 2
          
          echo "Manual trigger detected. Starting screen recording..."
          
          # 👉 FIX 2: Pehle folder ke andar jao taaki sab file ek hi jagah bane
          cd "Web Scrape"
          
          # FFmpeg se recording start
          ffmpeg -video_size 1920x1080 -framerate 30 -f x11grab -i :99.0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p recording.mp4 > /dev/null 2>&1 &
          FFMPEG_PID=$!
          
          # Python script run karna
          # 👉 FIX 3: Agar python script fail ho, tab bhi video smoothly save ho
          python scraper.py || echo "Python script stopped or failed, but saving video safely..."
          
          # Recording stop karna aur file save karna
          kill -INT $FFMPEG_PID
          sleep 3

      - name: Run Scraper WITHOUT Screen Recording (Automatic Run)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Sirf Virtual Display start karega, recording nahi
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          
          # 👉 Yahan bhi sleep 2 add karna zaroori hai
          sleep 2
          
          echo "Automatic trigger detected. Skipping screen recording..."
          cd "Web Scrape"
          python scraper.py

      - name: Upload Artifacts
        # 👉 FIX 4: v4 ka use karein aur always() lagayein (taaki error aane par bhi screenshot upload ho)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: Web-Scrape-Results
          # 👉 FIX 5: Space wale folder ke names me double quotes lagayein
          path: |
            "Web Scrape/screenshot.png"
            "Web Scrape/recording.mp4"
          if-no-files-found: ignore
