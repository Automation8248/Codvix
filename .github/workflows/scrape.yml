name: Cloudflare Web Scraper

on:
  workflow_dispatch: # Manual trigger (Screen Recording ON)
  schedule:
    - cron: '0 6 * * *' # Automatic trigger (Screen Recording OFF)

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase pyperclip
          sudo apt-get update
          # xclip is required for clipboard (copy icon) to work in headless Linux
          sudo apt-get install -y xvfb fluxbox ffmpeg xclip

      - name: Run Scraper WITH Screen Recording (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Create Recordings folder
          mkdir -p "Web Scrape/Recordings"
          
          # Start Xvfb (Virtual Display) and Window Manager
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          fluxbox > /dev/null 2>&1 &
          sleep 1
          
          echo "Manual trigger detected. Starting full-length screen recording (WEBM)..."
          # FFmpeg script run hone se PEHLE start hota hai
          ffmpeg -video_size 1920x1080 -framerate 30 -f x11grab -i :99.0 -c:v libvpx-vp9 -crf 30 -b:v 0 -deadline realtime "Web Scrape/Recordings/recording.webm" > /dev/null 2>&1 &
          FFMPEG_PID=$!
          
          # Yahan actual Python script poori tarah run hogi
          cd "Web Scrape"
          python scraper.py
          
          # Python script END hone ke BAAD recording stop hogi
          kill -INT $FFMPEG_PID
          sleep 5

      - name: Run Scraper WITHOUT Screen Recording (Automatic Run)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Start Virtual Display and Window Manager only
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          fluxbox > /dev/null 2>&1 &
          sleep 1
          
          cd "Web Scrape"
          python scraper.py

      - name: 🎥 Upload Screen Recording (Artifact)
        # 👉 Aapki demand ke anusaar @v4 use kiya gaya hai (Fastest artifact upload)
        uses: actions/upload-artifact@v4
        # Yeh step tabhi chalega jab manual run hoga, warna memory aur time bachayega
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: welib-screen-recordings
          # Recordings folder se saari .webm files uthayega
          path: Web Scrape/Recordings/**/*.webm
          retention-days: 5

      - name: 📚 Upload Scraped Books & Data (Artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Downloaded-Books-Data
          path: |
            Web Scrape/Books/
            Web Scrape/Screenshots/
          retention-days: 5
