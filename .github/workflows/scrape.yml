name: Cloudflare Web Scraper

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 6 * * *' # Automatic trigger

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox ffmpeg

      - name: Run Scraper
        # Manual ya Auto, ab script dono run same tarike se karegi
        run: |
          # 1. Virtual Display aur Window Manager start
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          
          fluxbox > /dev/null 2>&1 &
          sleep 1
          
          cd "Web Scrape"
          
          # 2. Python run karo (Ye khud hi recording start aur stop kar lega manual hone par)
          python scraper.py || echo "Script encountered an error."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: Web-Scrape-Results
          path: |
            "Web Scrape/screenshot.png"
            "Web Scrape/recording.webm"
          if-no-files-found: ignore
