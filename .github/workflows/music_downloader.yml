name: Telegram Music Downloader Automation

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          pip install requests

      # Yahan working-directory add kiya gaya hai
      - name: Run Downloader & Uploader Script
        working-directory: "./Music Downloader" 
        env:
          AUTOMATION_STORAGE_TOKEN: ${{ secrets.AUTOMATION_STORAGE_TOKEN }}
          AUTOMATION_CHAT_ID: ${{ secrets.AUTOMATION_CHAT_ID }}
        run: python main.py

      # Commit karte waqt bhi directory define karni hogi
      - name: Commit and Push Updated History
        working-directory: "./Music Downloader"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Auto-updated history.json after workflow run" || echo "No changes to commit"
          git push
