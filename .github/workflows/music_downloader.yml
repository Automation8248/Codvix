name: Pixabay Background Music Downloader

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0' 

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Music Downloader Script
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }} # Injecting API Key here
        run: |
          python "Music Downloader/download_music.py"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Rahul"
          git config --global user.email "singhrahul41771@gmail.com"
          git add "Intresting Fact/music/"
          
          if git diff --staged --quiet; then
            echo "No new music downloaded."
          else
            git commit -m "chore: auto-downloaded 20 soft piano background music files via API"
            git push
          fi
