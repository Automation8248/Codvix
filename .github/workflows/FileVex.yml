name: FileVex Automation

on:
  workflow_dispatch:

permissions:
  contents: write  # GitHub bot ko repo mein changes save karne ki permission

jobs:
  download-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          pip install requests

      - name: Run FileVex Downloader
        run: python FileVex/downloader.py

      - name: Save File to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add FileVex/downloads/
          git commit -m "Auto-downloaded file added via FileVex" || echo "No changes to commit"
          git push
