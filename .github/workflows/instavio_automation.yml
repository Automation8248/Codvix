name: Instavio Daily Bot

on:
  workflow_dispatch: # Manual button ke liye
  schedule:
    - cron: '0 2 * * *' # Har raat 2 AM (Server time) chalega

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install Required Packages
        working-directory: ./Instavio
        # Yahan script chalne ke liye NPM packages install kar rahe hain
        run: npm install axios form-data 

      - name: 🚀 Run Instavio Code (Download + Upload)
        working-directory: ./Instavio
        env:
          # Aapke GitHub Secrets ko secure environment variables mein pass karna
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          ELITE_CLOUD_API_KEY: ${{ secrets.ELITE_CLOUD_API_KEY }} 
        run: node downloader.js

      - name: 💾 Save History back to GitHub
        # Script ke chalne ke baad jo bhi naye URL history.txt me add hue honge, 
        # ye step unhe automatically aapke Github repo mein update (commit) kar dega.
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Instavio/*/history.txt Instavio/usernames.txt
          git commit -m "Auto-updated video history" || echo "No changes to commit"
          git push
