name: Download, Rename and Zip Images

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-and-zip:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone workspace codes
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Setup target Python environment
    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Step 3: Install runtime dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # Step 4: Run the fixed image processor tool using custom GH_TOKEN secret
    - name: Run Image Processing Script
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }} # Binds your custom secret to the environment variable
      run: python download_images.py

    # Step 5: Export Zip file as direct web browser artifact
    - name: Upload Renamed Images Zip
      uses: actions/upload-artifact@v4
      with:
        name: renamed-images-bundle
        path: all_images_renamed.zip
        retention-days: 5
