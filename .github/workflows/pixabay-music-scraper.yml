name: Pixabay Music Scraper (SeleniumBase)

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Xvfb & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          sbase install chromedriver

      - name: Run Scraper with Virtual Display
        run: |
          xvfb-run --auto-servernum --server-num=99 --server-args="-screen 0 1280x720x24" python scraper.py
        env:
          DISPLAY: :99

      - name: Upload Music Links
        uses: actions/upload-artifact@v4
        with:
          name: music-links
          path: music_links.txt
          retention-days: 5

      - name: Upload Screen Recording
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording
          path: recordings/
          retention-days: 5
