name: Insta Video URL 👍👍👍

on:
  workflow_dispatch: # Manual button dabane par chalega
  schedule:
    - cron: '0 2 * * *' # Har raat 2 AM chalega (Optional)

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Automation ko beech mein band hone se bachane ke liye

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Playwright & Dependencies
        working-directory: ./Instavio
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🚀 Run Playwright Scraper
        working-directory: ./Instavio
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
        run: node scraper.js

      - name: 🎥 Upload Screen Recordings as Artifact
        uses: actions/upload-artifact@v4
        # Agar script fail bhi ho jaye, tab bhi recording upload karega
        if: always() 
        with:
          name: instavio-screen-recordings
          path: Instavio/**/*.webm
          retention-days: 5 # 5 din baad recording automatically delete ho jayegi taaki space bache

      - name: 💾 Save video.txt links back to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Instavio/*/video.txt
          git commit -m "Auto-update video links from scraper" || echo "No new links to commit"
          git push
