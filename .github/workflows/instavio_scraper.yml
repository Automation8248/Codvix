name: Instavio Anti-Detect Scraper

on:
  workflow_dispatch: # Manual button dabane par (Screen Recording ON hogi)
  schedule:
    # 0 1 * * * = UTC 1:00 AM (Yani India Time IST ke subah 6:30 AM) par auto-run
    - cron: '0 1 * * *' 

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Latest LTS version

      - name: 📦 Install Playwright & Stealth Plugins
        working-directory: ./Instavio
        run: |
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: 🚀 Run Stealth Scraper
        working-directory: ./Instavio
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          # Yahan detect hoga ki button (workflow_dispatch) se run hua hai ya auto-timer se
          RECORD_VIDEO: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scraper.js

      - name: 🎥 Upload Screen Recording (Artifact)
        # 👉 Aapki demand ke anusaar @v4 use kiya gaya hai (Fastest artifact upload)
        uses: actions/upload-artifact@v4
        # Yeh step tabhi chalega jab manual run hoga, warna memory aur time bachayega
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: instavio-screen-recordings
          # Recordings folder se saari .webm files uthayega
          path: Instavio/Recordings/**/*.webm
          retention-days: 5 

      - name: 💾 Save Track.json & Video links to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # Naye URLs aur track.json ko update karega
          git add Instavio/*/video.txt Instavio/track.json || true
          git commit -m "Auto-update tracked user data and video URLs" || echo "No new data to commit"
          git push
