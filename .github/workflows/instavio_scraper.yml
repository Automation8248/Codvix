name: Instavio Anti-Detect Scraper

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Playwright & Stealth Plugins
        working-directory: ./Instavio
        run: |
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: 🚀 Run Stealth Scraper
        working-directory: ./Instavio
        env:
          RECORD_VIDEO: ${{ github.event_name == 'workflow_dispatch' }}
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          TELEGRAM_FAIL_TOKEN: ${{ secrets.TELEGRAM_FAIL_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scraper.js

      - name: 🎥 Upload Screen Recording (Artifact)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: instavio-screen-recordings
          # 👉 FIX: Path ko simple kar diya gaya hai
          path: Instavio/Recordings/
          retention-days: 5 

      - name: 💾 Save Track data & Video links to GitHub
        working-directory: ./
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Instavio/*/video.txt Instavio/track.json || true
          git commit -m "Auto-update tracked users and video URLs" || echo "No new data to commit"
          git pull --rebase origin main
          git push
