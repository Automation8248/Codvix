name: Instavio Anti-Detect Scraper

on:
  workflow_dispatch: # Manual button dabane par
  schedule:
    - cron: '0 2 * * *' # Auto run (Har raat)

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Playwright & Stealth Plugins
        working-directory: ./Instavio
        run: |
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: 🚀 Run Stealth Scraper
        working-directory: ./Instavio
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          # 👉 NAYA LOGIC: Agar manually run hua hai, toh RECORD_VIDEO ki value 'true' hogi, warna 'false'
          RECORD_VIDEO: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scraper.js

      - name: 🎥 Upload Screen Recording (Artifact)
        uses: actions/upload-artifact@v4
        # 👉 NAYA LOGIC: Yeh upload step SIRF tabhi chalega jab aapne manual run kiya hoga (workflow_dispatch)
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: instavio-screen-recordings
          path: Instavio/**/*.webm
          retention-days: 5 

      - name: 💾 Save Track.json & Video links to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Instavio/*/video.txt Instavio/track.json
          git commit -m "Auto-update tracked user data and video URLs" || echo "No new links to commit"
          git push
