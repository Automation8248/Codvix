name: Insta video downloader 👍👍👍

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Har raat chalega, par sirf 1 user process karega

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Playwright
        working-directory: ./Instavio
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 🚀 Run Playwright Scraper
        working-directory: ./Instavio
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }} # Secret variable injection
        run: node scraper.js

      - name: 🎥 Upload Screen Recording (Artifact)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: instavio-screen-recordings
          path: Instavio/**/*.webm
          retention-days: 5 

      - name: 💾 Save Track.json & Video links to GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # video.txt aur track.json ko update karke wapas save karega
          git add Instavio/*/video.txt Instavio/track.json
          git commit -m "Auto-update tracked user data and video URLs" || echo "No new links to commit"
          git push
