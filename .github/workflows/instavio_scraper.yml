name: Instavio Anti-Detect Scraper

on:
  workflow_dispatch: # Sirf manual button ("Run workflow") se chalega

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Reels dekhne aur long process ke liye time limit badhai gayi hai

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Playwright & Stealth Plugins
        working-directory: ./Instavio
        run: |
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: 🚀 Run Stealth Scraper
        working-directory: ./Instavio
        env:
          # GitHub Secrets se variables fetch karna
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          TELEGRAM_FAIL_TOKEN: ${{ secrets.TELEGRAM_FAIL_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scraper.js

      - name: 🎥 Upload Screen Recording (Artifact)
        uses: actions/upload-artifact@v4
        # always() isliye taaki agar code error de, tab bhi record hui video upload ho jaye
        if: always() 
        with:
          name: instavio-screen-recordings
          path: Instavio/Recordings/**/*.webm
          retention-days: 5 

      - name: 💾 Save Track data & Video links to GitHub
        working-directory: ./
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Naye URLs aur user memory ko update karega
          git add Instavio/*/video.txt Instavio/track.json || true
          git commit -m "Auto-update tracked users and video URLs" || echo "No new data to commit"
          
          # Push karne se pehle GitHub se latest changes merge karega taaki rejection error na aaye
          git pull --rebase origin main
          
          # Final push to repository
          git push
