<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pichub · professional image search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --violet-50:  #f5f3ff;
      --violet-100: #ede9fe;
      --violet-200: #ddd6fe;
      --violet-300: #c4b5fd;
      --violet-400: #a78bfa;
      --violet-500: #8b5cf6;
      --violet-600: #7c3aed;
      --violet-700: #6d28d9;
      --violet-800: #5b21b6;
      --violet-900: #4c1d95;
      --slate-50:   #f8fafc;
      --slate-100:  #f1f5f9;
      --slate-200:  #e2e8f0;
      --slate-500:  #64748b;
      --slate-700:  #334155;
      --slate-900:  #0f172a;
    }

    body {
      background: linear-gradient(180deg, #faf5ff 0%, #f5f7fc 300px);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
    }

    /* ----- Top Bar ----- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.8rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      box-shadow: 0 10px 24px -6px rgba(124, 58, 237, 0.5);
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--slate-900) 0%, var(--violet-700) 120%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--violet-100), var(--violet-200));
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      color: var(--violet-800);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      border: 1px solid var(--violet-300);
      margin-left: 0.2rem;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: white;
      padding: 0.55rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.06);
      border: 1px solid var(--violet-100);
      color: var(--slate-700);
    }

    .api-status i {
      color: #22c55e;
      font-size: 0.6rem;
    }

    /* ----- WIDE Search Bar ----- */
    .search-section {
      display: flex;
      justify-content: center;
      margin-bottom: 1.4rem;
    }

    .search-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 30px -8px rgba(124, 58, 237, 0.12), 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 2px solid var(--violet-100);
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.15s;
      height: 70px;
      padding: 0 1.5rem;
    }

    .search-wrapper:hover {
      border-color: var(--violet-200);
    }

    .search-wrapper:focus-within {
      border-color: var(--violet-500);
      box-shadow: 0 0 0 5px rgba(139, 92, 246, 0.15), 0 12px 32px -8px rgba(124, 58, 237, 0.2);
    }

    .search-icon {
      color: var(--violet-500);
      font-size: 1.3rem;
      margin-right: 1rem;
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      font-weight: 500;
      outline: none;
      color: var(--slate-900);
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    #searchInput::placeholder {
      color: #a5a3c0;
      font-weight: 400;
      font-size: 1.05rem;
    }

    .search-hint {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--violet-600);
      background: var(--violet-50);
      border: 1px solid var(--violet-200);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .search-hint i {
      font-size: 0.65rem;
    }

    /* ----- All Topics Section (below search bar) ----- */
    .topics-section {
      display: flex;
      justify-content: center;
      margin-bottom: 2.4rem;
    }

    .topics-wrapper {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
    }

    .topic-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: white;
      padding: 0.55rem 1.1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--slate-700);
      cursor: pointer;
      transition: all 0.18s;
      border: 1px solid var(--violet-100);
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.03);
      white-space: nowrap;
      user-select: none;
    }

    .topic-chip i {
      color: var(--violet-500);
      font-size: 0.8rem;
      transition: color 0.18s;
    }

    .topic-chip:hover {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      color: white;
      border-color: var(--violet-600);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(124, 58, 237, 0.4);
    }

    .topic-chip:hover i {
      color: white;
    }

    .topic-chip.active {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      color: white;
      border-color: var(--violet-600);
      box-shadow: 0 8px 18px -6px rgba(124, 58, 237, 0.4);
    }

    .topic-chip.active i {
      color: white;
    }

    /* ----- Status Bar ----- */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      font-size: 0.9rem;
      color: var(--slate-500);
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .query-badge {
      background: white;
      padding: 0.5rem 1.3rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--slate-900);
      border: 1px solid var(--violet-100);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
    }

    .query-badge i {
      color: var(--violet-500);
      font-size: 0.8rem;
    }

    .loader {
      display: none;
      align-items: center;
      gap: 0.6rem;
      color: var(--violet-700);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid var(--violet-100);
      border-top: 2.5px solid var(--violet-600);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ----- Image Grid ----- */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-top: 0.5rem;
    }

    .card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.05), 0 1px 4px rgba(0, 0, 0, 0.02);
      transition: transform 0.25s ease, box-shadow 0.25s;
      border: 1px solid var(--violet-100);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 40px -12px rgba(124, 58, 237, 0.2), 0 8px 16px rgba(0, 0, 0, 0.03);
      border-color: var(--violet-200);
    }

    .img-container {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--violet-50);
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    /* ----- Card Footer with Actions ----- */
    .card-footer {
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      background: white;
      border-top: 1px solid var(--violet-50);
    }

    .photographer {
      font-weight: 500;
      font-size: 0.8rem;
      color: var(--slate-700);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .photographer a {
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s;
    }

    .photographer a:hover {
      color: var(--violet-600);
    }

    .photographer a i {
      font-size: 0.7rem;
      color: var(--violet-400);
    }

    .card-actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .action-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--violet-100);
      background: var(--violet-50);
      color: var(--violet-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.18s;
      text-decoration: none;
    }

    .action-btn:hover {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      color: white;
      border-color: var(--violet-500);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px -4px rgba(124, 58, 237, 0.5);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn.copied {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border-color: #16a34a;
    }

    /* ----- Welcome / Empty States ----- */
    .empty-state, .welcome-state {
      text-align: center;
      padding: 4.5rem 1.5rem;
      background: white;
      border-radius: 32px;
      border: 1px solid var(--violet-100);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.04);
      grid-column: 1 / -1;
    }

    .welcome-state .state-icon {
      width: 74px;
      height: 74px;
      background: linear-gradient(135deg, var(--violet-100), var(--violet-200));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--violet-600);
      margin: 0 auto 1.4rem;
      box-shadow: 0 12px 24px -8px rgba(124, 58, 237, 0.25);
    }

    .welcome-state h2, .empty-state h2 {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
      color: var(--slate-900);
    }

    .welcome-state p, .empty-state p {
      color: var(--slate-500);
      font-size: 0.95rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .suggestion-container {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .suggestion {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--violet-50);
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--violet-800);
      cursor: pointer;
      transition: all 0.18s;
      border: 1px solid var(--violet-100);
    }

    .suggestion:hover {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      color: white;
      border-color: var(--violet-600);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px -6px rgba(124, 58, 237, 0.4);
    }

    /* ----- Error ----- */
    .error-message {
      background: #fef2f2;
      border-radius: 20px;
      padding: 1.2rem 1.8rem;
      color: #b91c1c;
      font-weight: 500;
      border: 1px solid #fecaca;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.95rem;
    }

    .error-message i {
      font-size: 1.3rem;
    }

    /* ----- Toast ----- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, var(--violet-700), var(--violet-900));
      color: white;
      padding: 0.85rem 1.6rem;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 16px 32px -8px rgba(76, 29, 149, 0.5);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      color: #4ade80;
    }

    /* ----- Responsive ----- */
    @media (max-width: 750px) {
      body { padding: 1.5rem 1rem; }
      .brand h1 { font-size: 1.6rem; }
      .brand-icon { width: 38px; height: 38px; font-size: 1.1rem; }
      .search-wrapper { height: 60px; padding: 0 1.1rem; }
      #searchInput { font-size: 1rem; }
      .search-hint { display: none; }
      .topics-wrapper { justify-content: flex-start; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.2rem; }
      .card-footer { padding: 0.7rem 0.8rem; }
      .action-btn { width: 30px; height: 30px; font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      body { padding: 1rem 0.8rem; }
      .brand h1 { font-size: 1.4rem; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      .search-wrapper { height: 54px; }
      .image-grid { grid-template-columns: 1fr; }
      .welcome-state { padding: 3rem 1rem; }
      .welcome-state h2 { font-size: 1.3rem; }
      .topic-chip { font-size: 0.78rem; padding: 0.45rem 0.9rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-camera"></i></div>
      <h1>Pichub</h1>
      <span class="brand-badge">pro</span>
    </div>
    <div class="api-status">
      <i class="fas fa-circle"></i>
      <span>Unsplash · <span id="rateLimitIndicator">50/50 remaining</span></span>
    </div>
  </div>

  <!-- WIDE Search Bar -->
  <div class="search-section">
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search high-resolution images…" autocomplete="off" aria-label="Search images">
      <span class="search-hint"><i class="fas fa-arrow-turn-down"></i> Enter</span>
    </div>
  </div>

  <!-- All Topics (parallel chips with icons, no emojis) -->
  <div class="topics-section">
    <div class="topics-wrapper" id="topicsWrapper">
      <div class="topic-chip" data-query="trending"><i class="fas fa-fire"></i> Trending</div>
      <div class="topic-chip" data-query="mountains"><i class="fas fa-mountain"></i> Mountains</div>
      <div class="topic-chip" data-query="ocean"><i class="fas fa-water"></i> Ocean</div>
      <div class="topic-chip" data-query="forest"><i class="fas fa-tree"></i> Forest</div>
      <div class="topic-chip" data-query="architecture"><i class="fas fa-building"></i> Architecture</div>
      <div class="topic-chip" data-query="coffee"><i class="fas fa-mug-hot"></i> Coffee</div>
      <div class="topic-chip" data-query="minimal"><i class="fas fa-circle"></i> Minimal</div>
      <div class="topic-chip" data-query="technology"><i class="fas fa-microchip"></i> Technology</div>
      <div class="topic-chip" data-query="animals"><i class="fas fa-paw"></i> Animals</div>
      <div class="topic-chip" data-query="flowers"><i class="fas fa-seedling"></i> Flowers</div>
      <div class="topic-chip" data-query="city"><i class="fas fa-city"></i> City</div>
      <div class="topic-chip" data-query="food"><i class="fas fa-utensils"></i> Food</div>
      <div class="topic-chip" data-query="travel"><i class="fas fa-plane"></i> Travel</div>
      <div class="topic-chip" data-query="sports"><i class="fas fa-futbol"></i> Sports</div>
      <div class="topic-chip" data-query="fashion"><i class="fas fa-tshirt"></i> Fashion</div>
      <div class="topic-chip" data-query="art"><i class="fas fa-palette"></i> Art</div>
      <div class="topic-chip" data-query="night"><i class="fas fa-moon"></i> Night</div>
      <div class="topic-chip" data-query="sunset"><i class="fas fa-sun"></i> Sunset</div>
      <div class="topic-chip" data-query="desert"><i class="fas fa-sun"></i> Desert</div>
      <div class="topic-chip" data-query="snow"><i class="fas fa-snowflake"></i> Snow</div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <div id="queryInfo" class="query-badge"><i class="fas fa-sparkles"></i> trending</div>
    <div id="loader" class="loader">
      <span class="spinner"></span> loading…
    </div>
  </div>

  <div id="gridContainer" class="image-grid"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastText">Link copied!</span>
</div>

<script>
  (function() {
    // --------------------------------------------------------------
    // 🔑 UNSPLASH API CONFIGURATION
    // --------------------------------------------------------------
    const UNSPLASH_ACCESS_KEY = 'KPkvu0dZJnXsMMBI7BX1uncfWwx45NxBl8zbtMnh7Gg';
    const UNSPLASH_API = 'https://api.unsplash.com';

    const RESULTS_PER_SEARCH = 100;

    // DOM elements
    const searchInput = document.getElementById('searchInput');
    const gridContainer = document.getElementById('gridContainer');
    const loader = document.getElementById('loader');
    const queryInfo = document.getElementById('queryInfo');
    const rateLimitIndicator = document.getElementById('rateLimitIndicator');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const topicChips = document.querySelectorAll('.topic-chip');

    let rateLimitRemaining = 50;
    let rateLimitTotal = 50;

    function updateRateLimitDisplay() {
      if (rateLimitIndicator) {
        rateLimitIndicator.textContent = `${rateLimitRemaining}/${rateLimitTotal} remaining`;
      }
    }
    updateRateLimitDisplay();

    // ----- Toast -----
    let toastTimer = null;
    function showToast(message, isError = false) {
      toastText.textContent = message;
      const icon = toast.querySelector('i');
      icon.className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
      icon.style.color = isError ? '#fca5a5' : '#4ade80';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    // ----- Loading state -----
    function setLoading(isLoading) {
      loader.style.display = isLoading ? 'flex' : 'none';
    }

    // ----- Show error -----
    function showError(message) {
      gridContainer.innerHTML = `
        <div class="error-message">
          <i class="fas fa-exclamation-triangle">
